                          }
                    - cards: ## cards variable for expander child [this card will be expanded]
                        - type: tile
                          entity: alarm_control_panel.alarmo
                          vertical: false
                          features:
                            - type: alarm-modes
                              modes:
                                - armed_home
                                - armed_night
                                - armed_away
                                - disarmed
                          features_position: bottom
                          card_mod:
                            style:
                              .: |
                                ha-card .content { 
                                  display: none !important;
                                }
                              ha-tile-container $: |
                                .content {
                                  display: none !important;
                                }
                              .features hui-alarm-modes-tile-feature $: |
                                .container {
                                  padding: 0px !important;
                                }
                              .features hui-alarm-modes-tile-feature $ .container ha-control-select $ .container: |
                                .option {
                                  background-color: transparent !important;
                                  border-radius: 13px !important;
                                }
                              hui-card-features $:
                                hui-alarm-modes-card-feature $:
                                  ha-control-select$: |
                                    .container {
                                      background-color: rgba(var(--contrast2-rgb), 1) !important;
                                    }
                    - title_card: ## title card variable [this card is displayed]
                        type: custom:button-card
                        template: dados_alarm_card
                        styles:
                          card:
                            - overflow: visible
