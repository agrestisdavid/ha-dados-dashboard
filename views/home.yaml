                - view_layout: # alarm grid area
                    grid-area: alarm
                  type: custom:decluttering-card ## decluttering card
                  template: dados_expander_base ## decluttering card template
                  variables: ## decluttering card variables
                    - entity: alarm_control_panel.alarmo ## entity variable -> change to your alarm entity
