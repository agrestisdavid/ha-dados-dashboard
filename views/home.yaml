title: Home
path: home
type: sections
max_columns: 2
cards: []
dense_section_placement: false
badges: []

icon: mdi:home
header: #Title
  layout: center
  badges_position: bottom
  badges_wrap: wrap
  card:
    type: markdown
    text_only: true
    content: "# Mansion"
sections:
  - type: grid
    cards:
      - type: custom:gap-card
        grid_options:
          columns: full
          rows: 0.5
        # visibility:
        #   - condition: screen
        #     media_query: "(min-width: 768px)"
    column_span: 2

  - type: grid #map-left
    cards:
      - type: vertical-stack
        cards:
          - type: custom:button-card ##gap-over-map
            entity: light.dummy
            show_name: false
            show_state: false
            tap_action:
              action: none
            styles:
              card:
                - background: transparent
                - height: 70px
            section_mode: true
            grid_options:
              rows: 1
              columns: 6
            visibility:
              - condition: screen
                media_query: "(min-width: 768px)"
          - type: map ##map
            entities:
              - entity: person.dado
              - entity: person.feri
            theme_mode: auto
            grid_options:
              columns: full
              rows: 6.5
            hours_to_show: 12
            visibility:
              - condition: screen
                media_query: "(min-width: 768px)"
            card_mod:
              style:
                .: |
                  ha-card {
                    border-radius: 46px !important;
                    overflow: hidden !important;
                    margin-top: 0px !important;
    visibility:
      - condition: screen
        media_query: "(min-width: 768px)"
    column_span: 1
  - type: grid #simple-tabs
    cards:
      - type: custom:simple-tabs
        show_fade: true
        hide_inactive_tab_titles: true
        background-color: var(--contrast2)
        active-text-color: var(--black5)
        active-background: var(--tabs)
        hover-color: var(--contrast4)
        border-color: var(--contrast2)
        button_padding: 15px
        default_tab: 2
        tabs_gap: 10px
        tabs:
          - title: Dado #change to your username and add cards for your personal tab
            icon: m3o:face
            id: user1
            # conditions:
            # - user:
            #   - userid
            card:
              type: vertical-stack
              cards:
                - type: custom:bubble-card
                  card_type: separator
                  sub_button:
                    main: []
                    bottom: []
                  name: Mercedes
                  icon: mdi:car
                - type: custom:button-card
                  template: dados_button
                  variables:
                    entity: switch.nd665fd_vorklimatisierung
                    img_cell_background: var(--sky)
                    percent: button.nd665fd_preclimate_start
                    name: Vorklimatisierung
                  custom_fields:
                    toggle:
                      card:
                        type: custom:button-card
                        template: dados_toggle
                        variables:
                          entity: "[[[ return variables.entity ]]]"
                  styles:
                    grid:
                      - grid-template-columns: 55px 1fr 55px
                - type: custom:button-card
                  template: dados_bar
                  variables:
                    entity: sensor.nd665fd_fuel_level
                    img_cell_background: var(--orange)
                    percent: sensor.nd665fd_fuel_level
                    name: Diesel
                    label: Tank
                - type: custom:button-card
                  template: dados_bar
                  variables:
                    entity: sensor.nd665fd_state_of_charge
                    img_cell_background: var(--green)
                    percent: sensor.nd665fd_state_of_charge
                    name: Elektrisch
                    label: Batterie
                - type: custom:button-card
                  template: dados_bar
                  variables:
                    entity: sensor.nd665fd_adblue_level
                    img_cell_background: var(--sky)
                    percent: sensor.nd665fd_adblue_level
                    name: AD Blue
                    label: Reichweite

                # - type: custom:button-card
                #   template: dados_light
                #   variables:
                #     entity: light.deckenlicht_buro
                # - type: custom:decluttering-card
                #   template: dados_light_expander
                #   variables:
                #     - entity: light.kommode_wohnzimmer
                # - type: custom:decluttering-card
                #   template: dados_vacuum_roboter_card
                #   variables:
                #     - card_mod:
                #         style: |
                #           ha-card {
                #             border-radius: 36px !important;
                #             overflow: hidden !important;
                #             padding-bottom: 0px !important;
                #           }

          - title: Home #home-tab
            icon: m3r:home-and-garden
            card:
              type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                grid-gap: 5px
                grid-template-columns: 1fr 50%
                grid-template-rows: min-content 9.285714rem min-content min-content min-content
                grid-template-areas: |
                  "calendar calendar"
                  "weather trash"
                  "heating alarm"
                  "robo dish"
                  "music music"
              cards:
                - view_layout: # calendar grid area
                    grid-area: calendar
                  type: custom:button-card
                  entity: calendar.dienstplan_2 ## change calendar entity
                  show_state: false
                  show_name: false
                  show_icon: true
                  icon: mdi:calendar-month
                  tap_action:
                    action: navigate
                    navigation_path: "#calendar"
                  styles:
                    grid:
                      - grid-template-areas: '"i cal"'
                      - grid-template-columns: 3.95rem 1fr
                      - grid-template-rows: 1fr
                    card:
                      - padding: 0.857143rem # 12px / 14
                      - border-radius: 3.3rem
                      - background-color: var(--contrast2)
                    icon:
                      - color: var(--contrast2)
                      - width: 2.3rem
                      - height: 2.3rem
                    img_cell:
                      - justify-self: center
                      - align-self: start
                      - width: 45px
                      - height: 45px
                      - background: var(--peach)
                      - border-radius: 38%
                      - margin-top: 7px
                      - margin-right: "-12px"
                    custom_fields:
                      cal:
                        - align-self: flex-start
                        - justify-self: start
                        - width: 100%
                        - text-align: left
                        - padding: 10px
                        - margin-left: "-10px"
                        - border-radius: 36px
                        - overflow: hidden
                        - margin-top: "-18px"
                  custom_fields:
                    cal:
                      card:
                        type: custom:calendar-card-pro
                        entities:
                          - calendar.dienstplan_2 ## change calendar entity
                        days_to_show: 7
                        compact_days_to_show: 1
                        compact_events_to_show: 1
                        compact_events_complete_days: true
                        title: ""
                        background_color: transparent
                        accent_color: var(--red)
                        vertical_line_width: 6px
                        first_day_of_week: monday
                        show_current_week_number: false
                        week_separator_width: 1px
                        week_separator_color: var(--contrast15)
                        month_separator_width: 1px
                        month_separator_color: transparent
                        today_indicator: pulse
                        today_indicator_position: 5% 50%
                        today_indicator_color: transparent
                        day_font_size: 14px
                        show_month: false
                        time_24h: true
                        weather:
                          position: event
                          date:
                            show_conditions: true
                            show_high_temp: true
                            show_low_temp: false
                            icon_size: 14px
                            font_size: 12px
                            color: var(--primary-text-color)
                          event:
                            show_conditions: true
                            show_temp: true
                            icon_size: 14px
                            font_size: 12px
                            color: var(--primary-text-color)
                        tap_action:
                          action: navigate
                          navigation_path: "#calendar"
                        hold_action:
                          action: expand
                        card_mod:
                          style:
                            .: |
                              ha-card {
                                border-radius: 46px !important;
                              }
                  extra_styles: |
                    ha-card::before {
                      content: "";
                      position: absolute;
                      top: -20%;
                      left: -40%;
                      width: 60%;
                      height: 60%;
                      background: radial-gradient(
                        circle,
                        rgba(var(--red-rgb), 0.95) 0%,
                        rgba(var(--peach-rgb), 0.75) 35%,
                        rgba(var(--peach-rgb), 0.75) 70%
                      );
                      filter: blur(60px);
                      z-index: 0;
                      pointer-events: none;
                    }

                  section_mode: true
                  grid_options:
                    rows: auto
                    columns: 12
                  card_mod:
                    style:
                      .: |
                        ha-card {
                          overflow: hidden !important;
                          margin-top: -0px !important;
                          max-height: 130px;
                        }
                - view_layout: # weather grid area
                    grid-area: weather
                  type: custom:button-card
                  template: dados_base
                  variables:
                    entity: weather.forecast_home
                    navigation_path: "#weather"
                    state_display_entity: sensor.zuhause_outdoor_temperature
                    img_cell_background: var(--sky)
                    card_height: ""
                  name: >
                    [[[
                      const stateObj = states[variables.entity];
                      if (!stateObj) return 'Unknown';

                      const s = stateObj.state;
                      if (s === 'unavailable' || s === 'unknown') return 'Unknown';
                      return hass.formatEntityState ? hass.formatEntityState(stateObj) : s;
                    ]]]

                  icon: mdi:weather-sunny
                  state:
                    - value: fog
                      icon: m3o:foggy

                    - value: rainy
                      icon: m3o:rainy

                    - value: cloudy
                      icon: m3o:cloud

                    - value: partlycloudy
                      icon: m3o:partly-cloudy-day

                    - value: sunny
                      icon: m3o:sunny

                    - value: clear-night

                      icon: mdi:weather-night
                    - value: hail
                      icon: m3o:weather-hail

                    - value: lightning
                      icon: mdi:weather-lightning

                    - value: lightning-rainy
                      icon: mdi:weather-lightning-rainy

                    - value: pouring
                      icon: mdi:weather-pouring

                    - value: snowy
                      icon: mdi:weather-snowy

                    - value: snowy-rainy
                      icon: mdi:weather-snowy-rainy

                    - value: windy
                      icon: mdi:weather-windy

                    - value: windy-variant
                      icon: mdi:weather-windy-variant

                    - value: exceptional
                      icon: mdi:weather-tornado
                  tap_action:
                    action: navigate
                    navigation_path: "[[[ return variables.navigation_path ]]]"
                  styles:
                    card:
                      - height: "[[[ return variables.card_height ]]]"

                  section_mode: true
                  grid_options:
                    rows: 2
                    columns: 6
                  card_mod:
                    style:
                      .: |
                        ha-card {
                          margin-top: -15px !important;
                        }
                - view_layout: # trash grid area
