# Purpose
# - Provides the dishwasher “control block” UI (power toggle, start/abort controls, program selection,
#   and salt/rinse status buttons) as a reusable decluttering template.
# - Designed to be embedded inside a bigger expander/wrapper (e.g., dados_dishwasher_card).
#
# Defaults (variable inputs)
# - entity: program selector entity (select.*)
# - power_switch: dishwasher main power switch (switch.*)
# - status_entity: dishwasher operational status sensor
# - start_button: start button entity
# - salt_entity: salt indicator entity (used for service-call feature button)
# - salt_state_entity: salt “state” sensor used to decide the label (full vs empty)
# - rinse_entity: rinse aid indicator entity (used for service-call feature button)

dados_dishwasher_control:
  default:
    # Program selection entity (tile uses this as its main entity)
    - entity: select.geschirrspuler_ausgewahltes_programm_2

    # Power on/off switch used by the selector toggle card
    - power_switch: switch.geschirrspuler_einschalter_2

    # Dishwasher status sensor (declared as default; card uses a fixed one below)
    - status_entity: sensor.geschirrspuler_betriebszustand

    # Start button entity (declared as default; card uses a fixed one below)
    - start_button: button.geschirrspuler_start

    # Salt + rinse related entities
    - salt_entity: sensor.geschirrspuler_salz_fast_leer
    - salt_state_entity: sensor.geschirrspuler_salz
    - rinse_entity: sensor.geschirrspuler_klarspuler

  card:
    # Layout
    # - Stacks three blocks:
    #   1) Power toggle
    #   2) Start/abort control row (configured to show only “abort”)
    #   3) Program selector tile + salt/rinse status buttons at the bottom
    type: vertical-stack
    cards:
      # ------------------------------------------------------------
      # 1) POWER TOGGLE (selector-style toggle)
      # ------------------------------------------------------------
      - type: custom:button-card
        template: dados_selector_toggle
        variables:
          entity: '[[power_switch]]'
          img_cell_background: var(--purple)

          # Toggle options/labels/icons
          option1: "off"
          option2: "on"
          label1: "off"
          label2: "on"
          icon1: mdi:power-off
          icon2: mdi:power

      # ------------------------------------------------------------
      # 2) START / ABORT CONTROL (start button template)
      #    - Configured to only show “abort”
      # ------------------------------------------------------------
      - type: custom:button-card
        template: dados_start_button
        variables:
          # Note: These are hard-coded here (not using [[status_entity]] / [[start_button]])
          state_entity: sensor.geschirrspuler_betriebszustand
          start_button: button.geschirrspuler_start
          pause_button: button.geschirrspuler_abbrechen
          resume_button: button.geschirrspuler_start
          abort_button: button.geschirrspuler_abbrechen

          img_cell_background: var(--purple)
        styles:
          # Force a 2-column area that only contains "abort"
          grid:
            - grid-template-areas: |
                "abort abort"
          # Hide start/pause, show abort only
          custom_fields:
            start:
              - display: none
            pause:
              - display: none
            abort:
              - display: block

      # ------------------------------------------------------------
      # 3) PROGRAM SELECTOR TILE + BOTTOM FEATURE BUTTONS
      # ------------------------------------------------------------
      - type: tile
        # Main entity of the tile = program selector
        entity: '[[entity]]'
        vertical: false

        # Adds custom feature buttons (service-call feature)
        # - Shows salt + rinse status with icons and dynamic labels
        features:
          - type: custom:service-call
            entries:
              # Salt status “button”
              - type: button
                entity_id: '[[salt_entity]]'
                icon: mdi:shaker-outline
                value_attribute: options
                label: >-
                  {{ iif(is_state('[[salt_state_entity]]', 'full'), 'Voll', 'LEER!') }}
                thumb: transparent

              # Rinse aid status “button”
              - type: button
                entity_id: '[[rinse_entity]]'
                icon: m3o:glass-cup
                value_attribute: options
                label: >-
                  {{ iif(is_state('[[rinse_entity]]', 'full'), 'Voll', 'LEER!') }}
                thumb: transparent

            # Styling for the service-call feature buttons
            styles: |-
              :host {
                --mdc-icon-size: 25px;
                --icon-color: var(--contrast15);
                --label-color: var(--contrast15);
              }

        features_position: bottom

        # Make the tile itself visually minimal (transparent, no content text)
        card_mod:
          style:
            .: |
              ha-card {
                background: transparent !important;
                box-shadow: none !important;
                border: none !important;
                margin-top: 0px;
              }
              ha-card .content {
                display: none !important;
              }
